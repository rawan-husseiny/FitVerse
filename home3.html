    <script>
        const slider = document.getElementById('slider');
        const slides = slider.innerHTML;
        slider.innerHTML += slides;
        let autoScroll;

        function startAutoScroll() {
            autoScroll = setInterval(() => {
                slider.scrollLeft += 1.5;
                if (slider.scrollLeft >= slider.scrollWidth / 2) {
                    slider.scrollLeft = 0;
                }
            }, 15);
        }

        function stopAutoScroll() {
            clearInterval(autoScroll);
        }

        startAutoScroll();

        const rightArrow = document.querySelector('.right');
        const leftArrow = document.querySelector('.left');

        if (rightArrow) {
            rightArrow.addEventListener('click', () => {
                slider.scrollBy({ left: 300, behavior: 'smooth' });
            });
        }

        if (leftArrow) {
            leftArrow.addEventListener('click', () => {
                slider.scrollBy({ left: -300, behavior: 'smooth' });
            });
        }

        slider.addEventListener('mouseenter', stopAutoScroll);
        slider.addEventListener('mouseleave', startAutoScroll);

        /* SMOKE EFFECT */
        const canvas = document.getElementById('smokeCanvas');
        const ctx = canvas.getContext('2d');
        const box = document.querySelector('.hero');

        function resizeCanvas() {
            canvas.width = box.offsetWidth;
            canvas.height = box.offsetHeight;
        }

        resizeCanvas();

        let particles = [];
        const mouse = { x: null, y: null, radius: 120 };

        box.addEventListener('mousemove', (e) => {
            const rect = box.getBoundingClientRect();
            mouse.x = e.clientX - rect.left;
            mouse.y = e.clientY - rect.top;
        });

        box.addEventListener('mouseleave', () => {
            mouse.x = null;
            mouse.y = null;
        });

        class Particle {
            constructor() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.baseX = this.x;
                this.baseY = this.y;
                this.size = Math.random() * 25 + 10;
                this.density = Math.random() * 100 + 1;
            }

            draw() {
                ctx.fillStyle = "rgba(255,255,255,0.1)";
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            update() {
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = this.x - mouse.x;
                    let dy = this.y - mouse.y;
                    let distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < mouse.radius && distance !== 0) {
                        let force = (mouse.radius - distance) / mouse.radius;
                        let directionX = dx / distance;
                        let directionY = dy / distance;

                        this.x += directionX * force * this.density * 0.6;
                        this.y += directionY * force * this.density * 0.6;
                    }
                }

                this.x += (this.baseX - this.x) * 0.02;
                this.y += (this.baseY - this.y) * 0.02;
            }
        }

        function init() {
            particles = [];
            let count = (canvas.width * canvas.height) / 1500;
            for (let i = 0; i < count; i++) {
                particles.push(new Particle());
            }
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((particle) => {
                particle.update();
                particle.draw();
            });
            requestAnimationFrame(animate);
        }

        init();
        animate();

        window.addEventListener('resize', () => {
            resizeCanvas();
            init();
        });
    </script>
